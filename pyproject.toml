[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-from-scratch"
version = "0.1.0"
description = "ZeRO stages 0-3 (DDP, sharded optimizer, sharded gradients, sharded parameters) from scratch on torch.distributed collectives: exact equivalence to single-process AdamW, per-rank memory and communication bytes checked against the ZeRO formulas, and parameter re-gathering in backward through saved-tensor hooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
